name: Gerar executável Windows
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Gerar pasta portátil
        run: pyinstaller --noconfirm --clean demeter_dashboard.spec
      - name: Compactar
        shell: powershell
        run: Compress-Archive -Path dist\DemeterDashboard\* -DestinationPath DemeterDashboard-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DemeterDashboard-Windows
          path: DemeterDashboard-Windows.zip
          retention-days: 30
